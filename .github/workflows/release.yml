name: Release

# Dispatch-only. Tag the commit you want to ship first
# (`git tag vX.Y.Z && git push origin vX.Y.Z`), then run this workflow with
# that tag.
#
# Per dispatch: `android` and `ios` build jobs run in parallel. Once both
# finish, `github_release` creates or updates a *draft* GitHub Release with
# the APK attached. iOS always builds (verification only); set test_flight:
# true to additionally upload the IPA to TestFlight. AAB → Play Store is
# gated on play_store: true. Publishing the GitHub Release requires a separate
# explicit dispatch with publish_github_release: true after QA has signed off.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3) — must already exist'
        required: true
      play_store:
        description: 'Build AAB and upload to Play Store'
        type: boolean
        default: false
      track:
        description: 'Play Store track (only used when play_store: true)'
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      test_flight:
        description: 'Upload built IPA to TestFlight (IPA is always built for verification)'
        type: boolean
        default: false
      publish_github_release:
        description: 'Publish the GitHub draft after signed-build and QA approval'
        type: boolean
        default: false

env:
  # Matches ci.yml (#128 / #216): release builds now use the same toolchain CI
  # validates. 3.44 is backwards-compatible for our Android setup — the
  # built-in-Kotlin migration is only required at AGP 9.0+ (we're on AGP 8.11.1),
  # so KGP keeps working. Revisit when we move to AGP 9 (flutter/flutter#184837).
  FLUTTER_VERSION: '3.44.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # All Android and iOS release builds target the production Challenge API.
  # Keep the value in the environment so it can be validated once without
  # expanding it in shell source or workflow logs.
  CHALLENGE_API_BASE_URL: ${{ vars.CHALLENGE_API_BASE_URL }}

jobs:
  release_context:
    name: Validate tag and release version
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}

      - name: Validate tag against pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be a stable semantic version in the form vX.Y.Z."
            exit 1
          fi

          version="${tag#v}"
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch versions must each be between 0 and 99 for the Android version-code formula."
            exit 1
          fi
          expected_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if (( expected_code > 2100000000 )); then
            echo "::error::Computed Android version code exceeds the Play Store limit."
            exit 1
          fi
          expected_pubspec_version="${version}+${expected_code}"
          pubspec_version="$(awk '/^version:[[:space:]]*/ { sub(/^version:[[:space:]]*/, ""); print; exit }' crosscue/pubspec.yaml)"

          if [[ "$pubspec_version" != "$expected_pubspec_version" ]]; then
            echo "::error::crosscue/pubspec.yaml version must be ${expected_pubspec_version} for tag ${tag}; found ${pubspec_version:-<missing>}."
            exit 1
          fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$expected_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  validate_release_configuration:
    name: Validate release configuration
    needs: release_context
    runs-on: ubuntu-latest
    env:
      CHALLENGE_API_BASE_URL: ${{ vars.CHALLENGE_API_BASE_URL }}
      GOOGLE_OAUTH_SERVER_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_SERVER_CLIENT_ID }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      APPLE_DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
      APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      PLAY_STORE: ${{ inputs.play_store }}
      TEST_FLIGHT: ${{ inputs.test_flight }}

    steps:
      - name: Require release secrets and variables without logging values
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          require() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Required release configuration is missing: $name"
              missing=1
            fi
          }

          require CHALLENGE_API_BASE_URL "$CHALLENGE_API_BASE_URL"
          require GOOGLE_OAUTH_SERVER_CLIENT_ID "$GOOGLE_OAUTH_SERVER_CLIENT_ID"
          require KEYSTORE_BASE64 "$KEYSTORE_BASE64"
          require KEY_ALIAS "$KEY_ALIAS"
          require KEY_PASSWORD "$KEY_PASSWORD"
          require STORE_PASSWORD "$STORE_PASSWORD"
          require APPLE_DEVELOPER_CERTIFICATE_BASE64 "$APPLE_DEVELOPER_CERTIFICATE_BASE64"
          require APPLE_DEVELOPER_CERTIFICATE_PASSWORD "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD"
          require APPLE_PROVISIONING_PROFILE_BASE64 "$APPLE_PROVISIONING_PROFILE_BASE64"
          require APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 "$APPLE_WIDGET_PROVISIONING_PROFILE_BASE64"
          require APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64"

          if [[ "$TEST_FLIGHT" == 'true' ]]; then
            require APPLE_API_KEY "$APPLE_API_KEY"
            require APPLE_API_KEY_ID "$APPLE_API_KEY_ID"
            require APPLE_API_ISSUER_ID "$APPLE_API_ISSUER_ID"
          fi
          if [[ "$PLAY_STORE" == 'true' ]]; then
            require PLAY_SERVICE_ACCOUNT_JSON "$PLAY_SERVICE_ACCOUNT_JSON"
          fi
          (( missing == 0 )) || exit 1

          if [[ ! "$CHALLENGE_API_BASE_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo '::error::Release builds require CHALLENGE_API_BASE_URL to be a non-empty HTTPS URL.'
            exit 1
          fi
          if [[ ! "$GOOGLE_OAUTH_SERVER_CLIENT_ID" =~ ^[^[:space:]]+\.apps\.googleusercontent\.com$ ]]; then
            echo '::error::Release builds require a valid GOOGLE_OAUTH_SERVER_CLIENT_ID.'
            exit 1
          fi

          for encoded_value in \
            "$KEYSTORE_BASE64" \
            "$APPLE_DEVELOPER_CERTIFICATE_BASE64" \
            "$APPLE_PROVISIONING_PROFILE_BASE64" \
            "$APPLE_WIDGET_PROVISIONING_PROFILE_BASE64" \
            "$APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64"; do
            printf '%s' "$encoded_value" | base64 --decode >/dev/null
          done
          if [[ "$TEST_FLIGHT" == 'true' ]]; then
            printf '%s' "$APPLE_API_KEY" | base64 --decode >/dev/null
          fi
          if [[ "$PLAY_STORE" == 'true' ]]; then
            if ! jq -e . >/dev/null 2>&1 <<< "$PLAY_SERVICE_ACCOUNT_JSON"; then
              echo '::error::PLAY_SERVICE_ACCOUNT_JSON must contain valid JSON.'
              exit 1
            fi
          fi

  android:
    name: Build Android
    needs: [release_context, validate_release_configuration]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crosscue

    steps:
      - name: Check out tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/crosscue-release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/crosscue-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # No --no-pub: a release build must regenerate
          # GeneratedPluginRegistrant so dev-only plugins (integration_test)
          # are excluded. The stale registrant from `flutter pub get` lists
          # them and breaks compileReleaseJavaWithJavac.
          flutter build apk \
            --release \
            --build-name=${{ needs.release_context.outputs.version_name }} \
            --build-number=${{ needs.release_context.outputs.version_code }} \
            --dart-define=GOOGLE_OAUTH_SERVER_CLIENT_ID=${{ vars.GOOGLE_OAUTH_SERVER_CLIENT_ID }} \
            --dart-define=CHALLENGE_API_ENV=production \
            --dart-define=CHALLENGE_API_BASE_URL="$CHALLENGE_API_BASE_URL"

      - name: Build release AAB
        if: ${{ inputs.play_store == true }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/crosscue-release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          # No --no-pub: see the APK step above — the release build must
          # regenerate GeneratedPluginRegistrant to drop dev-only plugins.
          flutter build appbundle \
            --release \
            --build-name=${{ needs.release_context.outputs.version_name }} \
            --build-number=${{ needs.release_context.outputs.version_code }} \
            --dart-define=GOOGLE_OAUTH_SERVER_CLIENT_ID=${{ vars.GOOGLE_OAUTH_SERVER_CLIENT_ID }} \
            --dart-define=CHALLENGE_API_ENV=production \
            --dart-define=CHALLENGE_API_BASE_URL="$CHALLENGE_API_BASE_URL"

      - name: Reject debug-signed Android artifacts
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ "$KEY_ALIAS" == 'androiddebugkey' ]]; then
            echo '::error::The Android debug key alias cannot sign a release artifact.'
            exit 1
          fi

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          if [[ -z "$apksigner_path" ]]; then
            echo '::error::Android apksigner was not found on the release runner.'
            exit 1
          fi

          apk_info="$("$apksigner_path" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          if grep -qi 'Android Debug' <<< "$apk_info"; then
            echo '::error::Refusing to upload a debug-signed APK.'
            exit 1
          fi

          if [[ "${{ inputs.play_store }}" == 'true' ]]; then
            aab_info="$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)"
            if grep -qi 'Android Debug' <<< "$aab_info"; then
              echo '::error::Refusing to upload a debug-signed AAB.'
              exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crosscue-android-${{ needs.release_context.outputs.version_name }}
          path: crosscue/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        if: ${{ inputs.play_store == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crosscue-android-aab-${{ needs.release_context.outputs.version_name }}
          path: crosscue/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play Store
        if: ${{ inputs.play_store == true }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.tomhess.crosscue
          releaseFiles: crosscue/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

  ios:
    name: Build iOS (upload to TestFlight if requested)
    needs: [release_context, validate_release_configuration]
    runs-on: macos-latest

    defaults:
      run:
        working-directory: crosscue

    steps:
      - name: Check out tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}

      # macos-latest's default Xcode may lag behind the iOS SDK that our
      # plugins compile against (e.g. device_info_plus 12.4.0 references
      # NSProcessInfo.isiOSAppOnVision, iOS 17+). Pin to the newest stable
      # Xcode on the runner to guarantee an SDK that has those symbols.
      - name: Pin Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build a one-shot keychain that's discarded with the runner. Importing
      # straight into the default login keychain would leak the cert if the
      # runner image is ever reused.
      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        working-directory: .
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Avoids the "do you want to allow access" prompt during codesign.
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install provisioning profiles
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          SHARE_EXTENSION_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        working-directory: .
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/release.mobileprovision"
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/widget.mobileprovision"
          echo "$SHARE_EXTENSION_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/shareextension.mobileprovision"

      # Flutter's auto-generated ExportOptions.plist uses automatic signing,
      # which fails on CI (no Apple ID) and can't tell xcodebuild that the
      # installed profile is the iCloud-capable one. Hand it an explicit
      # manual-signing plist that maps the bundle id to the profile.
      - name: Write ExportOptions.plist
        working-directory: .
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>ZS9BL7472D</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>dev.tomhess.crosscue</key>
                  <string>Crosscue App Store</string>
                  <key>dev.tomhess.crosscue.CrosscueWidget</key>
                  <string>Crosscue Widget App Store</string>
                  <key>dev.tomhess.crosscue.CrosscueShareExtension</key>
                  <string>Crosscue Share Extension App Store</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        run: |
          flutter build ipa \
            --release \
            --no-pub \
            --build-name=${{ needs.release_context.outputs.version_name }} \
            --build-number=${{ needs.release_context.outputs.version_code }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=CHALLENGE_API_ENV=production \
            --dart-define=CHALLENGE_API_BASE_URL="$CHALLENGE_API_BASE_URL"

      # Auth via an App Store Connect API key (scoped role, individually
      # revocable) instead of an Apple ID + app-specific password. altool
      # locates the .p8 private key by APPLE_API_KEY_ID, expecting it at
      # ~/.appstoreconnect/private_keys/AuthKey_<id>.p8. The key is team-scoped,
      # so no --asc-provider is needed.
      - name: Upload to TestFlight
        if: ${{ inputs.test_flight == true }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APPLE_API_KEY" | base64 --decode \
            > "$KEY_DIR/AuthKey_$APPLE_API_KEY_ID.p8"

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

  github_release:
    name: Create or publish GitHub Release
    needs: [release_context, android, ios]
    # iOS is a verification gate: both jobs must succeed before the release
    # can be created or explicitly published.
    if: ${{ needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a GitHub Release

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: crosscue-android-*
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          name: Crosscue ${{ inputs.tag }}
          generate_release_notes: true
          # A release dispatch is a build-and-QA step by default. A later,
          # deliberate dispatch can set publish_github_release=true once the
          # signed artifacts, TestFlight/Play processing, and device QA pass.
          draft: ${{ inputs.publish_github_release != true }}
          # Only the APK is user-installable; an AAB is a Play Store publishing
          # format that can't be sideloaded. The AAB still ships to Play and is
          # retained as a CI build artifact — no need to attach it here.
          files: |
            artifacts/*.apk
